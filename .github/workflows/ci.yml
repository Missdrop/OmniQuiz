name: Build and test
on:
  workflow_call:
    secrets:
      SIGNPATH_API_TOKEN:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/publish-release.test.cjs
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --timeout 90s
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            command: flutter build apk --release --split-per-abi
            artifact: build/app/outputs/flutter-apk/*-release.apk
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle/
          - os: windows-latest
            target: windows
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release/
          - os: macos-latest
            target: macos
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release/OmniQuiz.app/
          - os: macos-latest
            target: ios
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux build libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - name: Prepare Android signing
        if: matrix.target == 'android' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python scripts/android_signing.py prepare-ci
      - name: Compile Android pull requests without release secrets
        if: matrix.target == 'android' && github.event_name == 'pull_request'
        run: flutter build apk --debug
      - name: Build signed Android release APKs
        if: matrix.target == 'android' && github.event_name != 'pull_request'
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          omniquiz_build_number=$(($(date +%s) - 1704067200))
          flutter build apk --release --split-per-abi --build-number "$omniquiz_build_number"
      - if: matrix.target != 'android'
        run: ${{ matrix.command }}
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install MSI packaging tools
        if: matrix.target == 'windows'
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path .tooling/wix
          .tooling/wix/wix.exe extension add WixToolset.UI.wixext/5.0.2
      - name: Package release assets
        run: python scripts/package_release.py ${{ matrix.target }}
      - name: Verify MSI payload with Windows Installer
        if: matrix.target == 'windows'
        run: python scripts/verify_windows_package.py
      - name: Validate SignPath configuration
        id: signpath
        if: matrix.target == 'windows' && github.event_name != 'pull_request' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -and $env:GITHUB_REF -notmatch '^refs/tags/v\d+\.\d+\.\d+$') {
            throw 'Production signing is restricted to main and stable version tags.'
          }
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing configuration: $name" }
          }
          $version = (Get-Item build/windows/x64/runner/Release/omniquiz.exe).VersionInfo.ProductVersion
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload Windows packages for origin-verified signing
        id: unsigned-windows
        if: matrix.target == 'windows' && github.event_name != 'pull_request' && vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-windows-unsigned
          path: |
            dist/OmniQuiz-windows-x64.msi
            dist/OmniQuiz-windows-x64.zip
          if-no-files-found: error
      - name: Request Windows signing and wait for maintainer approval
        if: matrix.target == 'windows' && github.event_name != 'pull_request' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: .tooling/signpath-signed
          parameters: |
            version: ${{ toJSON(steps.signpath.outputs.version) }}
      - name: Verify signed packages and select them for publication
        if: matrix.target == 'windows' && github.event_name != 'pull_request' && vars.SIGNPATH_ENABLED == 'true'
        run: python scripts/verify_signed_windows.py
      - name: Record verified Windows signing status for release notes
        if: matrix.target == 'windows'
        run: |
          python -c "import json, os, pathlib; pathlib.Path('dist/windows-signing-status.json').write_text(json.dumps({'signed': os.environ.get('OMNIQUIZ_WINDOWS_SIGNED') == 'true'}), encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: omniquiz-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
