# Validates repository changes using isolated build/test jobs; it does not publish a release.

name: Build and test
on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/publish-release.test.cjs
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --timeout 90s
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            command: flutter build apk --release --split-per-abi
            artifact: build/app/outputs/flutter-apk/*-release.apk
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle/
          - os: windows-latest
            target: windows
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release/
          - os: macos-latest
            target: macos
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release/OmniQuiz.app/
          - os: macos-latest
            target: ios
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux build libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - name: Prepare Android signing
        if: matrix.target == 'android' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python scripts/android_signing.py prepare-ci
      - name: Compile Android pull requests without release secrets
        if: matrix.target == 'android' && github.event_name == 'pull_request'
        run: flutter build apk --debug
      - name: Build signed Android release APKs
        if: matrix.target == 'android' && github.event_name != 'pull_request'
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          omniquiz_build_number=$(($(date +%s) - 1704067200))
          # The signed Android callback test build used 89160000; stable releases must upgrade it.
          if [ "$omniquiz_build_number" -le 89160000 ]; then omniquiz_build_number=89160001; fi
          flutter build apk --release --split-per-abi --build-number "$omniquiz_build_number"
      - if: matrix.target != 'android'
        run: ${{ matrix.command }}
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install MSI packaging tools
        if: matrix.target == 'windows'
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path .tooling/wix
          .tooling/wix/wix.exe extension add WixToolset.UI.wixext/5.0.2
      - name: Package release assets
        run: python scripts/package_release.py ${{ matrix.target }}
      - name: Verify MSI payload with Windows Installer
        if: matrix.target == 'windows'
        run: python scripts/verify_windows_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: omniquiz-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
