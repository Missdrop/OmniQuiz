name: Build and test
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/publish-release.test.cjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --timeout 90s
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            command: flutter build apk --debug
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle/
          - os: windows-latest
            target: windows
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release/
          - os: macos-latest
            target: macos
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release/OmniQuiz.app/
          - os: macos-latest
            target: ios
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - name: Package release assets
        run: python scripts/package_release.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: omniquiz-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
