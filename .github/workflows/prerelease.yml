name: Rolling prerelease
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Never interrupt asset replacement. GitHub retains the newest pending run.
concurrency:
  group: rolling-prerelease
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: omniquiz-*
          merge-multiple: true
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({ github, context, core, nightly: true });
