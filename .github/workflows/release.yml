# Packages version-tag builds; signing secrets and release publication belong to trusted jobs only.

name: Tag release
on:
  workflow_dispatch:
  push:
    tags:
      - '**'
      - '!nightly'
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.main-build.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
      - id: main-build
        uses: actions/github-script@v7
        with:
          script: |
            const select = require('./scripts/release-build.cjs');
            const run = await select({ github, context, core });
            core.setOutput('run-id', run || '');
  build:
    needs: prepare
    if: needs.prepare.outputs.run-id == ''
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-release-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: omniquiz-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.prepare.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({ github, context, core, nightly: false });
            await publish({ github, context, core, nightly: true });
